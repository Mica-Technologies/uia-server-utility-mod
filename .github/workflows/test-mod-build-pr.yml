name: Test Mod Build (Pull Request)

on: pull_request

# Superseded runs on the same PR are pointless — the server smoke test is slow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler + mod code stay Java 8 via
      # Jabel); older Gradle-JVM Java versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # CSM is now resolved as a regular Gradle dependency against the GitHub Releases
      # Ivy repo declared in repositories.gradle, pinned to gradle.properties#csmVersion.
      # No manual `gh release download` step needed.

      - name: Assemble mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      # The release workflow publishes this jar for dependent mods to compile against, so
      # a PR that stops producing it must fail here rather than at release time. `build`
      # produces it via the `apiJar` dependency wired in addon.gradle; that same task runs
      # the guard asserting the api package imports no SUM internals.
      - name: Assert the API jar was produced
        run: |
          if ! ls ./build/libs/*-api.jar >/dev/null 2>&1; then
            echo "::error::No -api.jar in build/libs. Check that apiPackage is still set in"
            echo "buildscript.properties and that addon.gradle still wires 'build' to 'apiJar'."
            ls -1 ./build/libs/ || true
            exit 1
          fi
          echo "API jar: $(ls -1 ./build/libs/*-api.jar)"

      - name: Upload API jar for review
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: build/libs/*-api.jar
          retention-days: 7

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/test/
          retention-days: 7

  server_smoke_test:
    name: Dedicated Server Smoke Test
    needs: compile
    runs-on: ubuntu-latest
    # World gen on a cold cache is the slow part; the script has its own inner budget.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `./gradlew build` passing proves nothing about whether the mod can LOAD on a
      # dedicated server: client-only classes reached from common code, a client mod
      # declared as a hard dependency, or a Side.CLIENT packet handler touching
      # Minecraft directly all compile cleanly and only fail at server startup.
      # SUM shipped three such bugs simultaneously in 2026.07.19 and took the Alto
      # server down; all three were caught by a single `runServer`.
      - name: Boot dedicated server and assert startup
        run: bash .github/scripts/server-smoke-test.sh
        env:
          SMOKE_TIMEOUT: '900'

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-log
          path: server-smoke.log
          retention-days: 7
