name: Test Mod Build (Pull Request)

on: pull_request

jobs:
  test_assemble_mod:
    name: Test Assemble Mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Fetch CSM jar for compile classpath
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # SUM has a compileOnly dep on CSM (see dependencies.gradle). Locally
          # Alex builds CSM as a sibling checkout; on CI we grab the latest CSM
          # release jar so CsmFireAlarmQuery resolves on the compile classpath.
          mkdir -p ../minecraft-city-super-mod/build/libs
          gh release download \
            --repo Mica-Technologies/minecraft-city-super-mod \
            --pattern 'minecraft-city-super-mod-*.jar' \
            --dir ../minecraft-city-super-mod/build/libs
          # Rename so it matches the *-dev.jar filter in dependencies.gradle.
          for jar in ../minecraft-city-super-mod/build/libs/minecraft-city-super-mod-*.jar; do
            mv "$jar" "${jar%.jar}-dev.jar"
          done
          ls -la ../minecraft-city-super-mod/build/libs/

      - name: Assemble mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000
