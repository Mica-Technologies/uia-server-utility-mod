name: Build Mod Release/Pre-Release (Main Branch)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a full release'
        required: false
        default: 'false'

jobs:
  assemble_release:
    name: Build Mod and Publish Release/Pre-Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # RFG runs the Gradle process on Java 21+ (compiler + mod code stay Java 8 via
      # Jabel); older Gradle-JVM Java versions are deprecated and slated for removal.
      - name: Set Up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Create Version Numbers
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

          # Calculate 'final' version number (YYYY.MM.DD).
          # If a release tag already exists for today, append SemVer 2.0
          # build metadata (+N) so subsequent same-day releases stay unique
          # without inventing a non-SemVer 4th segment.
          baseVersion=$(date -u +'%Y.%m.%d')
          git fetch --tags --quiet origin || true
          relVersion="$baseVersion"
          maxN=-1
          if git rev-parse -q --verify "refs/tags/$baseVersion" >/dev/null 2>&1; then
            maxN=0
          fi
          for existingTag in $(git tag -l "${baseVersion}+*"); do
            suffix="${existingTag#${baseVersion}+}"
            if [[ "$suffix" =~ ^[0-9]+$ ]] && [ "$suffix" -gt "$maxN" ]; then
              maxN="$suffix"
            fi
          done
          if [ "$maxN" -ge 0 ]; then
            relVersion="${baseVersion}+$((maxN + 1))"
          fi
          echo "REL_TAG=$relVersion" >> $GITHUB_ENV

          # Calculate 'pre-release' version number (YYYY.MM.DD-pre.hhmm.shorttz+COMMITSHORTSHA)
          preReleaseVersion=$(date -u +'%Y.%m.%d-pre.%H%M.%Z%z')"+$calculatedSha"
          echo "PRE_TAG=$preReleaseVersion" >> $GITHUB_ENV

      - name: Create Release Tag
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        run: |
          git tag "${{ env.REL_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.REL_TAG }}"

      - name: Create Pre-Release Tag
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        run: |
          git tag "${{ env.PRE_TAG }}" "${{ github.sha }}"
          git push origin "${{ env.PRE_TAG }}"

      # CSM is now resolved as a regular Gradle dependency against the GitHub Releases
      # Ivy repo declared in repositories.gradle, pinned to gradle.properties#csmVersion.
      # No manual `gh release download` step needed.

      - name: Assemble Mod with Gradle
        run: ./gradlew build -Dhttp.socketTimeout=60000 -Dhttp.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000 -Dorg.gradle.internal.http.connectionTimeout=60000

      # `| tail -n 1`: these values are pasted into a filename by the publish step below, so
      # any stray stdout line corrupts the release. Gradle can print banners during project
      # evaluation even under -q. CSM's release died exactly this way on 2026-07-27 when the
      # buildscript update check announced itself and the publish step ran
      # `cp ./build/libs/Build script update available!...`. SUM already suppresses that
      # specific check via systemProp.DISABLE_BUILDSCRIPT_UPDATE_CHECK in gradle.properties;
      # this guards against the next banner nobody predicted.
      - name: Save Mod Name to GITHUB_ENV
        run: |
          modName=$(${{github.workspace}}/gradlew -q printModName | tail -n 1 | xargs)
          echo "MOD_NAME=$modName" >> $GITHUB_ENV

      - name: Save Mod Version to GITHUB_ENV
        run: |
          modVersion=$(${{github.workspace}}/gradlew -q printModVersion | tail -n 1 | xargs)
          echo "MOD_VERSION=$modVersion" >> $GITHUB_ENV

      - name: Save Mod Archive Base Name to GITHUB_ENV
        run: |
          modArchiveBaseName=$(${{github.workspace}}/gradlew -q printArchivesBaseName | tail -n 1 | xargs)
          echo "MOD_ARCHIVE_BASE_NAME=$modArchiveBaseName" >> $GITHUB_ENV

      - name: Save Minecraft Version to GITHUB_ENV
        run: |
          minecraftVersion=$(${{github.workspace}}/gradlew -q printMinecraftVersion | tail -n 1 | xargs)
          echo "MINECRAFT_VERSION=$minecraftVersion" >> $GITHUB_ENV

      - name: Copy Assembled Mod Jar to GitHub Actions Workspace
        run: cp ./build/libs/${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar ./

      # The public economy API jar (docs/SUM_ECONOMY_API.md). Dependent mods compile
      # against this and run against the full mod jar above.
      #
      # `./gradlew build` produces it because addon.gradle wires `build` to depend on
      # `apiJar` — the GTCEu buildscript alone only attaches it under CI. Fail loudly if
      # it is missing rather than publishing a release that silently lacks it: a consumer
      # pinning a version that has no api jar gets an unresolvable dependency, and the
      # only clue is a 404.
      - name: Copy API Jar to GitHub Actions Workspace
        run: |
          apiJar="./build/libs/${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}-api.jar"
          if [ ! -f "$apiJar" ]; then
            echo "::error::Expected API jar not found at $apiJar."
            echo "Check that apiPackage is still set in buildscript.properties and that"
            echo "addon.gradle still wires the 'build' task to depend on 'apiJar'."
            ls -1 ./build/libs/ || true
            exit 1
          fi
          cp "$apiJar" ./

      - name: Calculate Hashes for the Jar
        id: calculate-hashes
        run: |
          sha1=$(sha1sum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          md5=$(md5sum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          sha256=$(sha256sum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          crc32=$(cksum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar | awk '{print $1}')
          echo "SHA1_HASH=$sha1" >> $GITHUB_ENV
          echo "MD5_HASH=$md5" >> $GITHUB_ENV
          echo "SHA256_HASH=$sha256" >> $GITHUB_ENV
          echo "CRC32_HASH=$crc32" >> $GITHUB_ENV

      - name: Calculate Hashes for the API Jar
        run: |
          apiSha256=$(sha256sum ./${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}-api.jar | awk '{print $1}')
          echo "API_SHA256_HASH=$apiSha256" >> $GITHUB_ENV

      - name: Create Release Entry
        if: ${{ github.event.inputs.release == 'true' && github.event.inputs.release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.REL_TAG }}
          name: Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Release of ${{ env.MOD_NAME }}
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            SHA-1: `${{ env.SHA1_HASH }}`
            SHA-256: `${{ env.SHA256_HASH }}`
            MD5: `${{ env.MD5_HASH }}`
            CRC-32: `${{ env.CRC32_HASH }}`

            ---

            **Players and server owners: download the `.jar` above.**

            `${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}-api.jar` is for
            *mod developers only*. It contains SUM's public economy API, for mods that
            integrate with SUM's economy. It is not a mod — putting it in your `mods`
            folder does nothing. Compile against it, and depend on the full mod at
            runtime. See `docs/SUM_ECONOMY_API.md`.

            API jar SHA-256: `${{ env.API_SHA256_HASH }}`
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar
            ${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}-api.jar

      - name: Create Pre-Release Entry
        if: ${{ github.event.inputs.release == 'false' || !github.event.inputs.release }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.PRE_TAG }}
          name: Pre-Release ${{ env.MOD_VERSION }} (${{ env.MINECRAFT_VERSION }})
          body: |
            Pre-Release of ${{ env.MOD_NAME }}
            Mod Version: ${{ env.MOD_VERSION }}
            Game Version: ${{ env.MINECRAFT_VERSION }}

            SHA-1: `${{ env.SHA1_HASH }}`
            SHA-256: `${{ env.SHA256_HASH }}`
            MD5: `${{ env.MD5_HASH }}`
            CRC-32: `${{ env.CRC32_HASH }}`

            NOTICE: This is a pre-release version of the mod and is not
            guaranteed to be stable or permanently available for download/usage.
            Pre-release versions of ${{ env.MOD_NAME }} may be removed or unavailable after
            90 days from their initial release.

            ---

            **Players and server owners: download the `.jar` above.**

            `${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}-api.jar` is for
            *mod developers only*. It contains SUM's public economy API, for mods that
            integrate with SUM's economy. It is not a mod — putting it in your `mods`
            folder does nothing. Compile against it, and depend on the full mod at
            runtime. See `docs/SUM_ECONOMY_API.md`.

            Do not pin a dependent mod to a pre-release API jar: pre-releases are
            deleted after 90 days, which will break that mod's build.

            API jar SHA-256: `${{ env.API_SHA256_HASH }}`
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}.jar
            ${{ env.MOD_ARCHIVE_BASE_NAME }}-${{ env.MOD_VERSION }}-api.jar
