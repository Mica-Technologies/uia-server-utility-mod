org.gradle.logging.stacktrace = all
org.gradle.jvmargs = -Xmx3G
enableJUnit = true

# Disable the GTCEu buildscript's configuration-time "is a newer build.gradle
# available?" check. It fetches raw.githubusercontent.com during project evaluation,
# which timed out and hard-failed CI (SocketTimeoutException at build.gradle:1454).
# We deliberately don't want the auto-update anyway — it would overwrite build.gradle
# and wipe our RFG 1.4.7 pin + addon customizations. Run `gradle updateBuildScript`
# manually if a buildscript refresh is ever wanted. (systemProp.* is read by the
# script's Boolean.getBoolean('DISABLE_BUILDSCRIPT_UPDATE_CHECK') guard.)
systemProp.DISABLE_BUILDSCRIPT_UPDATE_CHECK = true

# Pinned version of CSM (City Super Mod) resolved via the GitHub Releases Ivy
# repo in repositories.gradle. Bump this when SUM needs API surface from a
# newer CSM release; Gradle will fetch
# https://github.com/Mica-Technologies/minecraft-city-super-mod/releases/download/<tag>/...
csmVersion = 2026.07.27
