# Configuration file

economy_integration {
    # Which other mods may move money through SUM's economy API, and what each may do.
    # Format: '<modid>=<scope>,<scope>' - for example 'mycasino=wallet_read,wallet_write,escrow'.
    # Use '<modid>=*' to grant every scope. EMPTY BY DEFAULT, which denies every mod: a mod must
    # be listed here before it can touch a single player's balance.
    # Scopes: 'wallet_read' (see what a player is carrying), 'wallet_write' (spend from and credit
    # to it), 'bank_read' (see a bank balance), 'bank_write' (deposit and withdraw), 'escrow'
    # (hold wallet money while a wager or trade resolves). Some imply others, so you need not list
    # them: wallet_write grants wallet_read, bank_write grants bank_read, and escrow grants
    # wallet_write.
    # WHAT THIS IS: an operator control and an audit trail, NOT a security boundary. It lets you
    # revoke one integration without a code change, makes a mod that forgot to ask fail loudly
    # instead of half-working, and tags every transaction with the mod that made it. It CANNOT
    # stop a mod that is determined to reach into SUM directly - no setting inside Minecraft
    # could. Install only mods you trust with your economy.
    S:allowedMods <
        # A gambling mod: takes wagers from the wallet and holds stakes in escrow while a round
        # resolves. No bank access, so it can never reach a player's savings.
        mycasino=escrow
        # A shop mod that only needs to show balances and charge for purchases.
        fancyshops=wallet_write
        # An ATM-adjacent mod that also moves money in and out of the bank.
        bankterminals=wallet_write,bank_write
     >

    # When true (default), logs every wallet, bank and escrow operation another mod performs, with
    # the mod id, player, amount and outcome. This is the audit trail for money that SUM itself did
    # not move; turning it off makes an integration's mistakes very hard to reconstruct after the
    # fact.
    B:logTransactions=true

    # Largest bank amount another mod may deposit or withdraw in a single call, in dollars.
    # Set 0 for no limit (default). This does not limit SUM's own ATM.
    # Min: 0.0
    # Max: 1.0E12
    D:maxBankTransaction=0.0

    # Largest wallet amount another mod may move in a single call, in dollars. Applies to both
    # spending and crediting, because a bug that credits too much is the more expensive direction -
    # it invents money the economy never had. Set 0 for no limit (default). This does not limit
    # SUM's own shops, jobs or ATM.
    # Min: 0.0
    # Max: 1.0E12
    D:maxWalletTransaction=10000.0

    # How long after server start to wait before refunding escrow whose owning mod is missing. The
    # delay exists so a mod that simply loads late, or is temporarily removed for a restart, does
    # not have its in-flight wagers refunded out from under it.
    # Min: 0
    # Max: 10080
    I:orphanedEscrowGraceMinutes=15

    # When true (default), money still held in escrow by a mod that has been removed or
    # de-authorized is refunded to the players who put it up, once 'orphanedEscrowGraceMinutes' has
    # passed. Set false to leave it held for manual handling with '/sum econ api escrow'. Leaving
    # it false means a removed mod's players never see their stakes again without operator action.
    B:refundOrphanedEscrow=true
}


roadrunner {
    # List of block-to-speed-multiplier mappings. Each entry is in the format 'blockRegistryName=multiplier',
    # where multiplier is a decimal number representing the speed boost factor (e.g. 1.5 = 50% faster).
    # Both vanilla and modded blocks are supported. There is no limit on the number of entries.
    # A multiplier of 1.0 = normal speed, 1.5 = 50% faster, 2.0 = double speed, etc.
