// Add any additional Gradle commands or configuration here

// TOOLS FOR GITHUB ACTIONS
task printModVersion {
    doLast {
        println project.version
    }
}

task printArchivesBaseName {
    doLast {
        println project.findProperty('archivesBaseName')
    }
}

task printModName {
    doLast {
        println project.findProperty('modName')
    }
}

task printMinecraftVersion {
    doLast {
        println project.findProperty('minecraftVersion')
    }
}

// Mixin config discovery: add the MixinConfigs MANIFEST attribute so MixinBooter
// loads our config even when it doesn't auto-scan for filename patterns. The
// GTNH buildscript's getManifestAttributes() doesn't add this by default; we
// append it here so it survives buildscript updates.
if (project.hasProperty('usesMixins') && usesMixins.toBoolean()) {
    afterEvaluate {
        tasks.named('jar').configure {
            manifest {
                attributes 'MixinConfigs': "mixins.${project.modId}.json"
            }
        }
    }
}

// OneConfig bootstrap manifest entries for the published jar.
//
// The OneConfig wrapper jar is embedded into SUM's jar via `embed` in
// dependencies.gradle, so the wrapper's tweaker class
// (cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker) ends up inside
// SUM's META-INF/.../ classpath at runtime. For FML / LaunchWrapper to actually
// invoke that tweaker on production launches, SUM's MANIFEST.MF needs to declare
// it via TweakClass + TweakOrder. The wrapper's own jar manifest is empty
// (it's designed to be embedded into a host mod), so without this block end
// users would install SUM and nothing would bootstrap OneConfig.
//
// In dev launches the SUM jar isn't on the classpath (we run from build outputs),
// so this manifest entry is ignored there — dev wiring continues via
// minecraft.extraTweakClasses below.
//
// ForceLoadAsMod is already set to true by the GTNH buildscript's
// getManifestAttributes() (since containsMixinsAndOrCoreModOnly=false), so we
// don't re-set it here.
// Only apply the TweakClass MANIFEST entries when building a publishable jar — NOT when
// the dev run tasks are in the task graph. In a dev launch the SUM jar lives on the run
// classpath, so any tweaker declared in its MANIFEST is read by GradleStart and added as
// a "cascading tweaker." Combined with the SumCoreMod FMLCorePlugin entry on the same jar,
// this confuses FML's coremod scanner: FMLSanityChecker.injectData ends up calling
// FMLDeobfuscatingRemapper.setup at a point where it crashes inside Guava's BiMap with
// `RegularImmutableBiMap does not implement BiMap`. Dev runs already wire the tweaker
// via `minecraft.extraTweakClasses` in this file, so they don't need the MANIFEST entry
// at all. Published jars (./gradlew build, CI) still get it.
boolean isDevRun = project.gradle.startParameter.taskNames.any {
    it.contains('runClient') || it.contains('runServer')
}
if (!isDevRun) {
    afterEvaluate {
        tasks.named('jar').configure {
            manifest {
                attributes(
                        'TweakClass': 'cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker',
                        'TweakOrder': '0'
                )
            }
        }
    }
}

// ARM macOS (Apple Silicon) support for runClient17/runClient21:
// MC 1.12.2 bundles JNA 4.4.0 and java-objc-bridge 1.0.0, both x86_64-only.
// Override with arm64-compatible versions via java17PatchDependencies
// (loaded before MC's bundled libs on the classpath).
if (project.hasProperty('enableJava17RunTasks') && enableJava17RunTasks.toBoolean()) {
    dependencies {
        java17PatchDependencies('net.java.dev.jna:jna:5.13.0') { transitive = false }
        java17PatchDependencies('net.java.dev.jna:jna-platform:5.13.0') { transitive = false }
        java17PatchDependencies('ca.weblite:java-objc-bridge:1.1') { transitive = false }
    }
}

// OneConfig bootstrap wiring for runClient / runServer.
//
// The OneConfig-Bootstrap wrapper jar (declared as devOnlyNonPublishable in
// dependencies.gradle) ships cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker
// but its own META-INF/MANIFEST.MF is empty — it's designed to be embedded inside a
// host mod whose manifest declares the TweakClass. End users get the wiring via the
// standalone "OneConfig-Bootstrap" mod's manifest; here in dev we inject the same
// tweaker name into runClient/runServer's --tweakClass launch args so LaunchWrapper
// invokes the stage0 loader, which downloads the actual OneConfig binary into
// run/client/OneConfig/Loader/ on first launch.
//
// Note: we deliberately do NOT put cc.polyfrost:oneconfig-1.12.2-forge on the dev
// runtime classpath (see dependencies.gradle for the why) — its manifest references
// a tweaker class that doesn't exist as an artifact, and GradleStart's classpath
// scan would crash on it before we could even reach the OneConfig loader.
minecraft {
    extraTweakClasses.add('cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker')
}

// Apple-Silicon fallback: run the LWJGL2 client under x86_64 (Rosetta 2).
//
// runClient17 (lwjgl3ify/arm64-native) launches but its window is broken on macOS —
// lwjgl3ify 1.0.1 (RFB 1.0.6) skips the relauncher re-exec in the gradle dev launch, so
// GLFW never gets macOS's required first-thread handling and Apple's OpenGL-over-Metal
// driver crashes on a zero-area window. The reliable dev client on Apple Silicon is the
// vanilla LWJGL2 path under Rosetta, which uses Minecraft's bundled x86_64 LWJGL2/JNA.
//
// Usage:  ./gradlew runClient -Prosetta
// Requires Rosetta 2 (`softwareupdate --install-rosetta --agree-to-license`) and an
// x86_64 Java 8 JDK in a Gradle-auto-detected location (e.g.
// ~/Library/Java/JavaVirtualMachines/). Running an x86_64 java makes macOS run the whole
// client under Rosetta, so it uses Minecraft's bundled x86_64 LWJGL2/JNA natives.
//
// We select it via a toolchain spec rather than `executable`: RFG sets `javaLauncher` on
// the run tasks, and setting `executable` too makes Gradle reject the mismatched pair.
// Java 8 + Adoptium uniquely identifies the x86_64 Temurin here (the arm64 Java 8 is Azul),
// so the launcher resolves to it with no ambiguity. Bump the JDK by dropping a newer
// x86_64 Temurin 8 into the auto-detected dir (e.g. ~/Library/Java/JavaVirtualMachines/).
if (project.hasProperty('rosetta')) {
    def rosettaLauncher = javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.ADOPTIUM)
    }
    // RFG extracts LWJGL2 natives matching the *gradle* JVM's arch (arm64 here), but the
    // Rosetta client JVM is x86_64 and can't dlopen arm64 .dylibs. Point LWJGL2 at a dir of
    // x86_64 2.9.4 natives via org.lwjgl.librarypath (LWJGL2 checks it before java.library.path).
    // Populate it with:  curl -sSL -o /tmp/n.jar https://libraries.minecraft.net/org/lwjgl/lwjgl/lwjgl-platform/2.9.4-nightly-20150209/lwjgl-platform-2.9.4-nightly-20150209-natives-osx.jar
    //                    unzip -o -j /tmp/n.jar '*.dylib' -d .rosetta-natives/lwjgl2
    def rosettaNatives = file("${project.rootDir}/.rosetta-natives/lwjgl2")
    tasks.matching { it.name == 'runClient' }.configureEach {
        it.javaLauncher.set(rosettaLauncher)
        it.getExtraJvmArgs().add("-Dorg.lwjgl.librarypath=${rosettaNatives.absolutePath}".toString())
    }
    tasks.matching { it.name == 'runServer' }.configureEach {
        it.javaLauncher.set(rosettaLauncher)
    }
}
