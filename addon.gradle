// TOOLS FOR GITHUB ACTIONS
task printModVersion {
    doLast {
        println project.version
    }
}

task printArchivesBaseName {
    doLast {
        println project.findProperty('archivesBaseName')
    }
}

task printModName {
    doLast {
        println project.findProperty('modName')
    }
}

task printMinecraftVersion {
    doLast {
        println project.findProperty('minecraftVersion')
    }
}

// Mixin config discovery: add the MixinConfigs MANIFEST attribute so MixinBooter
// loads our config even when it doesn't auto-scan for filename patterns. The
// GTNH buildscript's getManifestAttributes() doesn't add this by default; we
// append it here so it survives buildscript updates.
if (project.hasProperty('usesMixins') && usesMixins.toBoolean()) {
    afterEvaluate {
        tasks.named('jar').configure {
            manifest {
                attributes 'MixinConfigs': "mixins.${project.modId}.json"
            }
        }
    }
}

// OneConfig bootstrap: deliberately NOT declared in this jar's MANIFEST.
//
// SUM embeds OneConfig's stage0 wrapper (see `embed` in dependencies.gradle), and the
// published MANIFEST used to declare `TweakClass: cc.polyfrost...LaunchWrapperTweaker` so
// LaunchWrapper would run it. That is actively harmful on 1.12.2:
//
//  1. Servers. LaunchWrapper honours TweakClass on BOTH sides, so a dedicated server
//     downloaded and loaded OneConfig — a client-only mod referencing IntegratedServer —
//     and Forge's SideTransformer killed startup with "Attempted to load class chd for
//     invalid side SERVER".
//
//  2. Mod discovery. FML's CoreModManager.discoverCoreMods (1.12.2, line ~395) does:
//         if (cascadedTweaker != null) { handleCascadingTweak(...);
//                                        ignoredModFiles.add(coreMod.getName());
//                                        continue; }
//     `ignoredModFiles.add` is UNCONDITIONAL and it `continue`s past the FMLCorePlugin
//     branch. There is no ForceLoadAsMod escape hatch — that attribute does not exist
//     anywhere in FML 1.12.2. So ANY jar declaring a TweakClass is dropped from mod
//     discovery. SUM only ever loaded because GlintColorizer declares the *same* OneConfig
//     tweaker class and is scanned first (g < s), so LaunchWrapper de-duplicated and
//     sum.jar's entry was inert. Pointing TweakClass at a SUM-owned class removed that
//     accident and SUM silently vanished from the game: no tabs, no items, no HUD, and
//     not even listed in OneConfig.
//
// So the jar declares no TweakClass at all, which restores the manifest shape SUM shipped
// for months before the OneConfig embed. Clients get OneConfig from the modpack (Alto
// ships GlintColorizer, which bootstraps it; the standalone OneConfig-Bootstrap mod also
// works). Dev runs wire the tweaker explicitly via minecraft.extraTweakClasses below.

// ARM macOS (Apple Silicon) support for runClient17/runClient21:
// MC 1.12.2 bundles JNA 4.4.0 and java-objc-bridge 1.0.0, both x86_64-only.
// Override with arm64-compatible versions via java17PatchDependencies
// (loaded before MC's bundled libs on the classpath).
if (project.hasProperty('enableJava17RunTasks') && enableJava17RunTasks.toBoolean()) {
    dependencies {
        java17PatchDependencies('net.java.dev.jna:jna:5.13.0') { transitive = false }
        java17PatchDependencies('net.java.dev.jna:jna-platform:5.13.0') { transitive = false }
        java17PatchDependencies('ca.weblite:java-objc-bridge:1.1') { transitive = false }
    }
}

// OneConfig bootstrap wiring for runClient / runServer.
//
// The OneConfig-Bootstrap wrapper jar (declared as devOnlyNonPublishable in
// dependencies.gradle) ships cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker
// but its own META-INF/MANIFEST.MF is empty — it's designed to be embedded inside a
// host mod whose manifest declares the TweakClass. End users get the wiring via the
// standalone "OneConfig-Bootstrap" mod's manifest; here in dev we inject the same
// tweaker name into runClient/runServer's --tweakClass launch args so LaunchWrapper
// invokes the stage0 loader, which downloads the actual OneConfig binary into
// run/client/OneConfig/Loader/ on first launch.
//
// Note: we deliberately do NOT put cc.polyfrost:oneconfig-1.12.2-forge on the dev
// runtime classpath (see dependencies.gradle for the why) — its manifest references
// a tweaker class that doesn't exist as an artifact, and GradleStart's classpath
// scan would crash on it before we could even reach the OneConfig loader.
//
// Client-only, for the same reason the published manifest goes through
// SumOneConfigTweaker: OneConfig is a client mod, so cascading its loader into a dev
// `runServer` reproduces the dedicated-server crash. runClient still gets it directly —
// no shim needed when we already know the side at configuration time.
boolean isDevServerRun = project.gradle.startParameter.taskNames.any {
    it.contains('runServer')
}
if (!isDevServerRun) {
    minecraft {
        extraTweakClasses.add('cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker')
    }
}

// Apple-Silicon fallback: run the LWJGL2 client under x86_64 (Rosetta 2).
//
// runClient17 (lwjgl3ify/arm64-native) launches but its window is broken on macOS —
// lwjgl3ify 1.0.1 (RFB 1.0.6) skips the relauncher re-exec in the gradle dev launch, so
// GLFW never gets macOS's required first-thread handling and Apple's OpenGL-over-Metal
// driver crashes on a zero-area window. The reliable dev client on Apple Silicon is the
// vanilla LWJGL2 path under Rosetta, which uses Minecraft's bundled x86_64 LWJGL2/JNA.
//
// Usage:  ./gradlew runClient -Prosetta
// Requires Rosetta 2 (`softwareupdate --install-rosetta --agree-to-license`) and an
// x86_64 Java 8 JDK in a Gradle-auto-detected location (e.g.
// ~/Library/Java/JavaVirtualMachines/). Running an x86_64 java makes macOS run the whole
// client under Rosetta, so it uses Minecraft's bundled x86_64 LWJGL2/JNA natives.
//
// We select it via a toolchain spec rather than `executable`: RFG sets `javaLauncher` on
// the run tasks, and setting `executable` too makes Gradle reject the mismatched pair.
// Java 8 + Adoptium uniquely identifies the x86_64 Temurin here (the arm64 Java 8 is Azul),
// so the launcher resolves to it with no ambiguity. Bump the JDK by dropping a newer
// x86_64 Temurin 8 into the auto-detected dir (e.g. ~/Library/Java/JavaVirtualMachines/).
if (project.hasProperty('rosetta')) {
    def rosettaLauncher = javaToolchains.launcherFor {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.ADOPTIUM)
    }
    // RFG extracts LWJGL2 natives matching the *gradle* JVM's arch (arm64 here), but the
    // Rosetta client JVM is x86_64 and can't dlopen arm64 .dylibs. Point LWJGL2 at a dir of
    // x86_64 2.9.4 natives via org.lwjgl.librarypath (LWJGL2 checks it before java.library.path).
    // Populate it with:  curl -sSL -o /tmp/n.jar https://libraries.minecraft.net/org/lwjgl/lwjgl/lwjgl-platform/2.9.4-nightly-20150209/lwjgl-platform-2.9.4-nightly-20150209-natives-osx.jar
    //                    unzip -o -j /tmp/n.jar '*.dylib' -d .rosetta-natives/lwjgl2
    def rosettaNatives = file("${project.rootDir}/.rosetta-natives/lwjgl2")
    tasks.matching { it.name == 'runClient' }.configureEach {
        it.javaLauncher.set(rosettaLauncher)
        it.getExtraJvmArgs().add("-Dorg.lwjgl.librarypath=${rosettaNatives.absolutePath}".toString())
    }
    tasks.matching { it.name == 'runServer' }.configureEach {
        it.javaLauncher.set(rosettaLauncher)
    }
}

// ---------------------------------------------------------------------------
// Build-time guard on the published jar's MANIFEST.
//
// On 2026-07-19 SUM shipped a release that declared
// `TweakClass: <a SUM-owned class>`. FML 1.12.2's CoreModManager.discoverCoreMods
// unconditionally calls ignoredModFiles.add() for ANY jar declaring a TweakClass and
// `continue`s past the FMLCorePlugin branch, so SUM was silently dropped from mod
// discovery: the pack loaded with no SUM tabs, items or HUD, and no error anywhere.
// (ForceLoadAsMod is NOT an escape hatch — it does not exist in FML 1.12.2.)
//
// That is invisible to `./gradlew build`, to the unit tests, and to runClient/runServer,
// because dev launches run from build/classes and wire tweakers via
// minecraft.extraTweakClasses — they never read this manifest. The only place it shows up
// is a real launcher against a real pack. So assert the invariants here, at build time,
// where breaking them costs seconds instead of a production incident.
//
// Checked on reobfJar because that is the artifact that actually ships: `jar` is disabled
// when shadowing is active, and reobfJar consumes shadowJar's output.
tasks.matching { it.name == 'reobfJar' }.configureEach {
    doLast {
        outputs.files.files.findAll { it.name.endsWith('.jar') }.each { File jarFile ->
            if (!jarFile.exists()) {
                return
            }
            java.util.jar.Manifest manifest = null
            new java.util.jar.JarFile(jarFile).withCloseable { jf ->
                manifest = jf.manifest
            }
            if (manifest == null) {
                throw new GradleException("${jarFile.name} has no MANIFEST.MF")
            }
            def attrs = manifest.mainAttributes
            def problems = []

            if (attrs.getValue('TweakClass') != null) {
                problems << ("declares TweakClass '${attrs.getValue('TweakClass')}' — any TweakClass "
                        + 'removes the jar from FML 1.12.2 mod discovery, so the mod silently '
                        + 'vanishes in production. Bootstrap OneConfig from the modpack instead.')
            }
            if (attrs.getValue('FMLCorePlugin') == null) {
                problems << ('is missing FMLCorePlugin — without it FML never instantiates SumCoreMod, '
                        + 'so MixinBooter never sees it in the coremod list and no SUM mixin applies.')
            }
            if (attrs.getValue('MixinConfigs') == null) {
                problems << ('is missing MixinConfigs — metadata only (SumCoreMod registers the config '
                        + 'via IEarlyMixinLoader), but its absence means the jar task lost the addon.gradle '
                        + 'manifest block, which usually means other attributes drifted too.')
            }

            if (!problems.isEmpty()) {
                throw new GradleException("Published jar MANIFEST is invalid:\n"
                        + problems.collect { "  - ${jarFile.name} ${it}" }.join('\n'))
            }
            logger.lifecycle("Manifest guard OK: ${jarFile.name} "
                    + '(no TweakClass, FMLCorePlugin + MixinConfigs present)')
        }
    }
}

// ---------------------------------------------------------------------------
// The public economy API jar (see docs/SUM_ECONOMY_API.md).
//
// `apiPackage = api` in buildscript.properties makes the GTCEu buildscript register an
// `apiJar` task, but it only attaches that task to the artifact set under CI or when
// deploymentDebug is on (build.gradle ~1152). A local `./gradlew build` therefore produces
// every other jar and silently skips this one — so anyone building SUM to get the API for a
// dependent mod finds no api jar and no error explaining why. Wire it into `build`.
tasks.matching { it.name == 'build' }.configureEach {
    dependsOn 'apiJar'
}

// Build-time guard on the API's isolation.
//
// The API's stability contract promises consumers the -api jar is self-contained: compile
// against it alone and your mod builds. An API class importing SUM's internals breaks that
// silently — it compiles fine here, because the whole mod is on this project's classpath,
// and only fails in the dependent mod's build, or later at runtime with a
// NoClassDefFoundError on someone's server. Same reasoning as the manifest guard above:
// assert the invariant where breaking it costs seconds.
tasks.matching { it.name == 'apiJar' }.configureEach {
    doLast {
        String internalPrefix = project.modGroup.toString() + '.'
        String apiPrefix = internalPrefix + 'api.'
        File apiSrc = file('src/main/java/' + internalPrefix.replace('.' as char, '/' as char) + 'api')
        if (!apiSrc.exists()) {
            throw new GradleException("API source directory is missing: ${apiSrc}")
        }
        def offenders = []
        apiSrc.eachFileRecurse { File sourceFile ->
            if (!sourceFile.name.endsWith('.java')) {
                return
            }
            sourceFile.readLines().eachWithIndex { String line, int index ->
                def matcher = (line =~ /^\s*import\s+(?:static\s+)?([\w.]+)/)
                if (matcher) {
                    String imported = matcher[0][1]
                    if (imported.startsWith(internalPrefix) && !imported.startsWith(apiPrefix)) {
                        offenders << "  - ${sourceFile.name}:${index + 1} imports ${imported}"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException('The api package leaks SUM internals, so the -api jar '
                    + 'would not be self-contained:\n' + offenders.join('\n')
                    + '\nKeep implementation behind an interface declared in the api package.')
        }
        logger.lifecycle('API isolation OK: api package imports no SUM internals')
    }
}
