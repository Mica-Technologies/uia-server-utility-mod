// Add any additional Gradle commands or configuration here

// TOOLS FOR GITHUB ACTIONS
task printModVersion {
    doLast {
        println project.version
    }
}

task printArchivesBaseName {
    doLast {
        println project.findProperty('archivesBaseName')
    }
}

task printModName {
    doLast {
        println project.findProperty('modName')
    }
}

task printMinecraftVersion {
    doLast {
        println project.findProperty('minecraftVersion')
    }
}

// Mixin config discovery: add the MixinConfigs MANIFEST attribute so MixinBooter
// loads our config even when it doesn't auto-scan for filename patterns. The
// GTNH buildscript's getManifestAttributes() doesn't add this by default; we
// append it here so it survives buildscript updates.
if (project.hasProperty('usesMixins') && usesMixins.toBoolean()) {
    afterEvaluate {
        tasks.named('jar').configure {
            manifest {
                attributes 'MixinConfigs': "mixins.${project.modId}.json"
            }
        }
    }
}

// ARM macOS (Apple Silicon) support for runClient17/runClient21:
// MC 1.12.2 bundles JNA 4.4.0 and java-objc-bridge 1.0.0, both x86_64-only.
// Override with arm64-compatible versions via java17PatchDependencies
// (loaded before MC's bundled libs on the classpath).
if (project.hasProperty('enableJava17RunTasks') && enableJava17RunTasks.toBoolean()) {
    dependencies {
        java17PatchDependencies('net.java.dev.jna:jna:5.13.0') { transitive = false }
        java17PatchDependencies('net.java.dev.jna:jna-platform:5.13.0') { transitive = false }
        java17PatchDependencies('ca.weblite:java-objc-bridge:1.1') { transitive = false }
    }
}

// OneConfig bootstrap wiring for runClient / runServer.
//
// The OneConfig-Bootstrap wrapper jar (declared as devOnlyNonPublishable in
// dependencies.gradle) ships cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker
// but its own META-INF/MANIFEST.MF is empty — it's designed to be embedded inside a
// host mod whose manifest declares the TweakClass. End users get the wiring via the
// standalone "OneConfig-Bootstrap" mod's manifest; here in dev we inject the same
// tweaker name into runClient/runServer's --tweakClass launch args so LaunchWrapper
// invokes the stage0 loader, which downloads the actual OneConfig binary into
// run/client/OneConfig/Loader/ on first launch.
//
// Note: we deliberately do NOT put cc.polyfrost:oneconfig-1.12.2-forge on the dev
// runtime classpath (see dependencies.gradle for the why) — its manifest references
// a tweaker class that doesn't exist as an artifact, and GradleStart's classpath
// scan would crash on it before we could even reach the OneConfig loader.
minecraft {
    extraTweakClasses.add('cc.polyfrost.oneconfig.loader.stage0.LaunchWrapperTweaker')
}
